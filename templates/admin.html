<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Администратора - DiaLog</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #2c3e50; color: #ecf0f1; margin: 0; padding: 20px; }
        .admin-container { max-width: 900px; margin: 0 auto; background: #34495e; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2c3e50; padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { margin: 0; color: #f1c40f; }
        .btn-back { background-color: #3498db; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .btn-back:hover { background-color: #2980b9; }
        .stats-grid { display: flex; gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #2c3e50; flex: 1; padding: 20px; border-radius: 8px; text-align: center; border-left: 5px solid #3498db; }
        .stat-card h3 { margin: 0 0 10px 0; font-size: 16px; color: #bdc3c7; }
        .stat-card .value { font-size: 32px; font-weight: bold; color: #ecf0f1; margin: 0; }
        table { width: 100%; border-collapse: collapse; background: #2c3e50; border-radius: 8px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #34495e; }
        th { background-color: #1a252f; color: #3498db; }
        tr:hover { background-color: #3b536b; }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="header">
            <h1>👑 Панель управления платформой</h1>
            <a href="/" class="btn-back">Вернуться в приложение</a>
        </div>

        <div class="stats-grid">
            <div class="stat-card" style="border-color: #2ecc71;">
                <h3>Всего пользователей</h3>
                <p class="value" id="totalUsers">0</p>
            </div>
            <div class="stat-card" style="border-color: #e74c3c;">
                <h3>Всего замеров в базе</h3>
                <p class="value" id="totalLogs">0</p>
            </div>
            <div class="stat-card" style="border-color: #f1c40f;">
                <h3>Средний сахар (Платформа)</h3>
                <p class="value" id="platformAvg">0</p>
            </div>
        </div>

        <h2>Активность пользователей</h2>
        <table>
            <thead>
                <tr>
                    <th>Логин пользователя</th>
                    <th>Количество записей</th>
                </tr>
            </thead>
            <tbody id="usersTableBody">
                <tr><td colspan="2" style="text-align: center;">Загрузка данных...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/admin/stats')
                .then(res => {
                    if (!res.ok) throw new Error('Доступ запрещен');
                    return res.json();
                })
                .then(data => {
                    document.getElementById('totalUsers').textContent = data.total_users;
                    document.getElementById('totalLogs').textContent = data.total_logs;
                    document.getElementById('platformAvg').textContent = data.platform_avg_sugar;
                    
                    const tbody = document.getElementById('usersTableBody');
                    tbody.innerHTML = '';
                    data.users_activity.forEach(user => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><strong>${user.username}</strong> ${user.username === 'admin' ? '(Админ)' : ''}</td>
                            <td>${user.log_count}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(err => {
                    document.getElementById('usersTableBody').innerHTML = `<tr><td colspan="2" style="color: #e74c3c; text-align: center;">Ошибка загрузки. Проверьте права.</td></tr>`;
                });
        });
    </script>
</body>
</html>
