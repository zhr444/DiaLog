<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Дневник Диабетика</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Подключаем библиотеку Chart.js для построения графиков -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>Дневник Диабетика</h1>
        
        <div class="form-section">
            <h2>Новая запись</h2>
            <form id="sugarForm">
                <div class="form-group">
                    <label for="sugar">Уровень сахара (ммоль/л):</label>
                    <input type="number" step="0.1" id="sugar" required>
                </div>
                
                <div class="form-group">
                    <label for="context">Время замера:</label>
                    <select id="context" required>
                        <option value="Натощак">Натощак</option>
                        <option value="Перед едой">Перед едой</option>
                        <option value="После еды">После еды</option>
                        <option value="Перед сном">Перед сном</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="notes">Заметки (еда, самочувствие):</label>
                    <textarea id="notes" rows="3"></textarea>
                </div>
                
                <button type="submit">Сохранить</button>
            </form>
            <div id="message"></div>
        </div>

        <div class="stats-section">
            <h3>Статистика за 7 дней</h3>
            <p>Средний сахар: <strong id="avgSugar">0</strong> ммоль/л | Всего замеров: <strong id="totalLogs">0</strong></p>
        </div>

        <!-- Новый блок для отрисовки графика -->
        <div class="chart-section">
            <canvas id="sugarChart"></canvas>
        </div>

        <div class="history-section">
            <h2>История замеров</h2>
            <div class="table-responsive">
                <table id="historyTable">
                    <thead>
                        <tr>
                            <th>Дата и время</th>
                            <th>Сахар</th>
                            <th>Контекст</th>
                            <th>Заметки</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody">
                        <!-- Сюда данные будут подгружаться через JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
