<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дневник Диабетика</title>
    <!-- Подключаем наш файл стилей -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Дневник Диабетика</h1>
        
        <!-- Форма добавления записи -->
        <div class="form-section">
            <h2>Новая запись</h2>
            <form id="sugarForm">
                <div class="form-group">
                    <label for="sugar">Уровень сахара (ммоль/л):</label>
                    <input type="number" step="0.1" id="sugar" required>
                </div>
                
                <div class="form-group">
                    <label for="context">Время замера:</label>
                    <select id="context" required>
                        <option value="Натощак">Натощак</option>
                        <option value="Перед едой">Перед едой</option>
                        <option value="После еды">После еды</option>
                        <option value="Перед сном">Перед сном</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="notes">Заметки (еда, самочувствие):</label>
                    <textarea id="notes" rows="3"></textarea>
                </div>
                
                <button type="submit">Сохранить</button>
            </form>
            <div id="message"></div>
        </div>

        <!-- Место для вывода истории -->
        <div class="history-section">
            <h2>История замеров</h2>
            <table id="historyTable">
                <thead>
                    <tr>
                        <th>Дата и время</th>
                        <th>Сахар</th>
                        <th>Контекст</th>
                        <th>Заметки</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                    <!-- Сюда данные будут подгружаться через JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Подключаем наш файл логики -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
